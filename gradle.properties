# Project-wide Gradle settings.

# JVM arguments (machine has 4 GB RAM — keep the daemon modest).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enable incremental tasks & configuration cache & parallel (2 cores)
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental.multiplatform=true
# iOS framework name
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true
# Cross-compile the iOS klibs on non-macOS hosts so the shared code is
# verified for iOS in CI too (framework linking still needs a Mac).
kotlin.native.enableKlibsCrossCompilation=true
