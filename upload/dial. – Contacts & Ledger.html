<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Contact Ledger</title>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',card:'var(--card)',ink:'var(--ink)',mute:'var(--mute)',line:'var(--line)',pri:'var(--pri)',pos:'var(--pos)',neg:'var(--neg)'},boxShadow:{card:'var(--sh)',key:'0 3px 10px rgba(30,65,58,.035)',floating:'0 12px 32px rgba(22,160,133,.25)'}}}}</script>
<style>
:root{--bg:#f7faf9;--bg2:#eef3f1;--card:#fff;--ink:#172b2a;--mute:#8b9a98;--line:#edf1ef;--pri:#16a085;--pri2:#16a085;--pos:#16a085;--neg:#e16c70;--sh:0 3px 10px rgba(30,65,58,.035);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--bg2:#0a100f;--card:#16211f;--ink:#e8f3f0;--mute:#8fa39f;--line:#243330;--pri:#2fc4a6;--pri2:#2fc4a6;--pos:#2fc4a6;--neg:#ef7d81;--sh:0 3px 10px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1514;--bg2:#0a100f;--card:#16211f;--ink:#e8f3f0;--mute:#8fa39f;--line:#243330;--pri:#2fc4a6;--pri2:#2fc4a6;--pos:#2fc4a6;--neg:#ef7d81;--sh:0 3px 10px rgba(0,0,0,.25);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg2);-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tab-content{animation:appear 180ms ease-out}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.key{transition:background-color 150ms ease,transform 150ms ease,box-shadow 150ms ease}
.key:active{transform:scale(.92);background-color:color-mix(in srgb,var(--pri) 10%,var(--card))}
.nav-item{transition:color 150ms ease}
.scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
.grad{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.gt{color:var(--ink)}
.glass{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes pop{from{transform:translate(0,-46%) scale(.94);opacity:0}to{transform:translate(0,-50%);opacity:1}}
.up{animation:up .28s cubic-bezier(.2,.8,.2,1)}.fade{animation:fd .2s}.pop{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
</style>
<style type="text/tailwindcss">
@layer components{
.card{@apply bg-card rounded-[24px] border border-line}
.inp{@apply w-full bg-bg border border-line rounded-2xl px-4 py-3 outline-none focus:border-pri text-ink}
.btn{@apply rounded-2xl px-4 py-2.5 text-sm font-semibold bg-card border border-line shadow-card active:scale-95 transition text-ink}
.chip{@apply inline-flex items-center gap-1 rounded-full bg-bg border border-line px-2.5 py-1 text-xs font-medium max-w-full}
.ib{@apply w-9 h-9 grid place-items-center rounded-xl bg-bg border border-line text-sm active:scale-90 transition}
}
</style>
</head>
<body>
<div id="app" class="relative mx-auto min-h-screen w-full max-w-[430px] overflow-hidden bg-bg pb-48 shadow-2xl sm:my-6 sm:min-h-[850px] sm:rounded-[34px]"></div>
<div id="sheet"></div><div id="toast"></div><input id="fi" type="file" multiple hidden><input id="vi" type="file" accept=".vcf,.csv,text/vcard,text/csv" hidden><input id="ri" type="file" accept=".json,application/json" hidden>
<nav id="nav" class="fixed inset-x-0 bottom-0 z-30 mx-auto max-w-[430px] border-t border-line px-3 pt-3 backdrop-blur-xl" style="background:color-mix(in srgb,var(--card) 95%,transparent);padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>(S&&S.set&&S.set.cur||'')+Math.abs(n).toLocaleString(S&&S.set&&S.set.loc||undefined,{maximumFractionDigits:2});
const digits=p=>{const v=(p||'').trim();let d=v.replace(/\D/g,'');if(S&&S.set&&S.set.cc&&!v.startsWith('+')&&d.startsWith('0'))d=S.set.cc+d.slice(1);return d};
const MV=n=>S.hide?'•••':fmt(n);
const IC={ph:'📞',em:'✉️',ln:'🔗',ad:'📍',ot:'📝',bd:'🎂',sc:'@'},TN={ph:'Phone',em:'Email',ln:'Link',ad:'Address',ot:'Other',bd:'Birthday',sc:'Social'};
let S=null,R={tab:'c',cid:null,sub:'ledger',lid:null,q:''};
try{S=JSON.parse(localStorage.getItem('cl2'))}catch(e){}
if(!S)S={c:[{id:'c1',name:'Abel Tesfaye',fav:true,f:[{id:'f1',t:'ph',l:'Mobile',v:'+251 911 234 567'},{id:'f2',t:'em',l:'Email',v:'abel@mail.com'}]},{id:'c2',name:'Sara Mohammed',fav:true,f:[{id:'f3',t:'ph',l:'Mobile',v:'+251 912 345 678'}]},{id:'c3',name:'Daniel Bekele',fav:true,f:[{id:'f4',t:'ph',l:'Mobile',v:'+251 913 456 789'}]},{id:'c4',name:'Hana Alemu',f:[{id:'f5',t:'ph',l:'Mobile',v:'+251 914 567 890'}]},{id:'c5',name:'Yonas Girma',f:[{id:'f6',t:'ph',l:'Mobile',v:'+251 915 678 901'}]},{id:'c6',name:'Mimi Hassan',f:[{id:'f7',t:'ph',l:'Mobile',v:'+251 916 789 012'}]}],t:[{id:'t1',cid:'c1',type:'credit',amt:5000,cat:'General',meth:'cash',note:'Loan',d:'2026-10-01',ts:1}],l:[{id:'l1',cid:'c1',k:'calc',title:'Groceries',post:true,items:[{id:'i1',name:'Rice',qty:5,unit:'bags',price:200,pays:[{id:'p1',amt:400,d:'2026-10-05'},{id:'p2',amt:600,d:'2026-10-12'}]},{id:'i2',name:'Oil',qty:3,unit:'litres',price:150,pays:[{id:'p3',amt:200,d:'2026-10-08'}]},{id:'i3',name:'Sugar',qty:10,unit:'kg',price:45,pays:[]}]}],n:[{id:'n1',cid:'c1',title:'Agreement',body:'Pays by the **5th** of each month.\n- Keep receipts',tags:'family',pin:true}],r:[],k:[['n:n1','l:l1'],['t:t1','n:n1']]};
let ENCLOCK=false,EK=null,ET=0;
const save=()=>{if(ENCLOCK)return;try{if(EK){clearTimeout(ET);ET=setTimeout(()=>encS(),300);localStorage.removeItem('cl2')}else localStorage.setItem('cl2',JSON.stringify(S))}catch(e){}};
const cur=()=>R.tab==='g'?null:R.cid;
const nowStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const lt=i=>i.qty*i.price*(1-(i.disc||0)/100)*(1+(i.tax||0)/100);
const pd=i=>Math.min((i.pays||[]).reduce((s,p)=>s+p.amt,0),lt(i));
const tot=l=>{let s=0,p=0;if(l.k==='calc')l.items.forEach(i=>{s+=lt(i);p+=pd(i)});const t=l.k==='calc'?s*(1-(l.disc||0)/100)*(1+(l.tax||0)/100)+(+l.extra||0):0;return{t,p,q:t-p,s}};
const bal=cid=>S.t.filter(t=>t.cid===cid).reduce((s,t)=>s+(t.type==='credit'?t.amt:-t.amt),0)+S.l.filter(l=>l.cid===cid&&l.post&&l.k==='calc').reduce((s,l)=>s+tot(l).q,0);
const bc=b=>b>0?'text-pos':b<0?'text-neg':'text-mute';
const tint=(c,a=14)=>`background:color-mix(in srgb,var(--${c}) ${a}%,var(--card))`;
const PAL=[['#E4EDE7','#527561'],['#F7E8DF','#B7785B'],['#E5E8F9','#6B75B5'],['#F4E5EE','#A65F88'],['#F4EEDB','#9B8243'],['#DFF0F0','#4A8585']];
const av=(n,big)=>{let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%6;const q=PAL[h],ini=n.trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'?';return `<div class="${big===2?'w-[58px] h-[58px] text-base rounded-[21px]':big?'w-20 h-20 text-2xl rounded-[28px]':'w-12 h-12 text-[13px] rounded-[17px]'} grid place-items-center font-semibold shrink-0 av" style="background:${q[0]};color:${q[1]}">${esc(ini)}</div>`};
const toast=m=>{const t=$('#toast');t.innerHTML=`<div class="fixed left-1/2 -translate-x-1/2 z-[60] rounded-full bg-[#203b35] px-5 py-3 text-xs font-medium text-white shadow-xl fade whitespace-nowrap" style="bottom:calc(92px + env(safe-area-inset-bottom,0px))">${esc(m)}</div>`;setTimeout(()=>t.innerHTML='',1600)};
const close=()=>$('#sheet').innerHTML='';

function sheet(title,fields,ok){
  const d=$('#sheet');
  d.innerHTML=`<div class="fixed inset-0 bg-black/50 z-40 fade" id="sx"></div><div class="fixed bottom-0 inset-x-0 z-50 card rounded-b-none p-5 space-y-3 max-w-xl mx-auto up" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))"><div class="w-10 h-1 rounded-full bg-line mx-auto"></div><div class="font-bold text-lg">${title}</div>${fields.map(f=>f[2]==='sel'?`<select id="f_${f[0]}" class="inp">${f[4].map(o=>`<option value="${o[0]}" ${o[0]===f[3]?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${f[0]}" placeholder="${f[1]}" type="${f[2]||'text'}" step="any" value="${esc(f[3]||'')}" class="inp">`).join('')}<button id="sok" class="grad w-full rounded-2xl py-3.5 font-bold">Save</button></div>`;
  $('#sx').onclick=close;
  $('#sok').onclick=()=>{const v={};fields.forEach(f=>v[f[0]]=$('#f_'+f[0]).value.trim());if(ok(v)===false)return;close();save();render()};
  const i=d.querySelector('input');if(i)i.focus();
}
function ask(t,m,lb,fn,tone='neg',ic='🗑️'){
  $('#sheet').innerHTML=`<div class="fixed inset-0 z-40 bg-black/50 fade" id="sx"></div><div class="fixed z-50 inset-x-6 top-1/2 max-w-sm mx-auto card p-6 text-center pop"><div class="w-16 h-16 rounded-full mx-auto grid place-items-center text-3xl mb-3" style="${tint(tone,16)}">${ic}</div><div class="font-extrabold text-lg">${t}</div><p class="text-mute text-sm mt-1.5">${m}</p><div class="flex gap-2.5 mt-6"><button id="sno" class="btn flex-1">Cancel</button><button id="sy" class="btn flex-1 border-0" style="background:var(--${tone});color:#fff">${lb}</button></div></div>`;
  $('#sx').onclick=$('#sno').onclick=close;
  $('#sy').onclick=()=>{close();fn();save();render()};
}
function picker(src){
  const all=[];S.c.forEach(c=>all.push('c:'+c.id));S.t.forEach(x=>all.push('t:'+x.id));S.l.forEach(l=>{all.push('l:'+l.id);l.items.forEach(i=>all.push('i:'+i.id))});S.n.forEach(x=>all.push('n:'+x.id));S.b.forEach(x=>all.push('b:'+x.id));(S.x||[]).forEach(x=>all.push('x:'+x.id));S.c.forEach(c=>c.f.forEach(f=>all.push('f:'+f.id)));S.l.forEach(l=>l.items.forEach(i=>(i.pays||[]).forEach(p=>all.push('p:'+p.id))));S.r.forEach(x=>all.push('r:'+x.id));
  const have=S.k.filter(p=>p.includes(src)).map(p=>p[0]===src?p[1]:p[0]);
  const L=all.filter(k=>k!==src&&!have.includes(k)).map(k=>[k,look(k)]).filter(x=>x[1]);
  const list=q=>L.filter(([k,o])=>(o.l+' '+o.s).toLowerCase().includes(q.toLowerCase())).map(([k,o])=>`<div data-k="${k}" class="flex items-center gap-3 p-3 rounded-2xl active:bg-bg"><div class="text-xl">${o.i}</div><div class="min-w-0"><div class="font-semibold truncate">${esc(o.l)}</div><div class="text-xs text-mute">${esc(o.s)}</div></div></div>`).join('')||'<p class="text-center text-mute py-6">Nothing to link.</p>';
  $('#sheet').innerHTML=`<div class="fixed inset-0 bg-black/50 z-40 fade" id="sx"></div><div class="fixed bottom-0 inset-x-0 z-50 card rounded-b-none p-5 max-w-xl mx-auto up" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))"><div class="font-bold text-lg mb-3">Link to…</div><input id="pq" placeholder="Search contacts, entries, lists, notes…" class="inp mb-2"><div id="pl" class="overflow-y-auto" style="max-height:48vh">${list('')}</div></div>`;
  $('#sx').onclick=close;$('#pq').oninput=e=>$('#pl').innerHTML=list(e.target.value);
  $('#pl').onclick=e=>{const b=e.target.closest('[data-k]');if(b){S.k.push([src,b.dataset.k]);close();save();render();toast('Linked')}};
}

function look(k){
  const t=k[0],id=k.slice(2);let o;
  if(t==='c'){o=S.c.find(x=>x.id===id);return o&&{i:'👤',l:o.name,s:'Contact'}}
  if(t==='i'){for(const L of S.l){o=L.items.find(x=>x.id===id);if(o)return{i:'🧾',l:o.name,s:'Item · '+L.title}}return}
  o=S[t].find(x=>x.id===id);if(!o)return;
  const c=S.c.find(x=>x.id===o.cid),s=(c?c.name:'General');
  const m={t:{i:o.type==='credit'?'↗':'↘',l:(o.note||o.type)+' · '+fmt(o.amt||0)},l:{i:o.k==='calc'?'🧮':'☑️',l:o.title},n:{i:'📝',l:o.title},r:{i:'⏰',l:o.title},b:{i:'🏦',l:o.label||o.bank||'Account'}}[t];
  return m&&{...m,s:s+' · '+{t:'Entry',l:'List',n:'Note',r:'Reminder',b:'Bank'}[t]};
}
const chips=k=>{const L=S.k.filter(p=>p.includes(k)).map(p=>p[0]===k?p[1]:p[0]).map(x=>[x,look(x)]).filter(x=>x[1]);
  return `<div class="flex flex-wrap gap-1.5 mt-3">${L.map(([x,o])=>`<span class="chip"><span data-a="go" data-k="${x}" class="truncate">${o.i} ${esc(o.l)}</span><span data-a="unlink" data-k="${k}" data-k2="${x}" class="text-mute pl-1">×</span></span>`).join('')}${S.a.filter(a=>a.o===k).map(fchip).join('')}<button data-a="link" data-k="${k}" class="chip border-dashed text-mute">🔗 Link</button><button data-a="attach" data-k="${k}" class="chip border-dashed text-mute">📎 Attach</button>${'tlnrbm'.includes(k[0])?`<button data-a="move" data-k="${k}" class="chip border-dashed text-mute">⇄ Move</button>`:''}</div>`};
function kill(t,id){
  const ks=[t+':'+id],own=['t','l','n','r','b','m'];
  if(t==='c'){own.forEach(x=>S[x].filter(o=>o.cid===id).forEach(o=>{ks.push(x+':'+o.id);if(x==='l')o.items.forEach(i=>ks.push('i:'+i.id))}));S.c=S.c.filter(c=>c.id!==id);own.forEach(x=>S[x]=S[x].filter(o=>o.cid!==id))}
  else if(t==='l'){S.l.find(l=>l.id===id).items.forEach(i=>ks.push('i:'+i.id));S.l=S.l.filter(l=>l.id!==id)}
  else if(t==='i'){S.l.forEach(l=>l.items=l.items.filter(i=>i.id!==id))}
  else S[t]=S[t].filter(o=>o.id!==id);
  S.k=S.k.filter(p=>!p.some(x=>ks.includes(x)));
  S.a.filter(a=>ks.includes(a.o)).forEach(a=>idb('del',a.id));S.a=S.a.filter(a=>!ks.includes(a.o));
}
function go(k){
  const t=k[0],id=k.slice(2);let o;R.q='';
  const at=cid=>{R.lid=null;R.tab=cid?'c':'g';R.cid=cid||null};
  if(t==='c'){at(id);R.sub='ledger'}
  else if(t==='l'){o=S.l.find(x=>x.id===id);at(o.cid);R.lid=id}
  else if(t==='i'){o=S.l.find(l=>l.items.some(i=>i.id===id));at(o.cid);R.lid=o.id}
  else{o=S[t].find(x=>x.id===id);at(o.cid);R.sub={t:'ledger',n:'notes',r:'rem',b:'bank'}[t]}
}

const head=(t,back,right)=>`<div class="px-5 pt-5 pb-3 flex items-center gap-3">${back?`<button data-a="back" class="btn !p-0 w-10 h-10 grid place-items-center text-xl" aria-label="Back">‹</button>`:''}<h1 class="text-[25px] font-bold tracking-tight flex-1 truncate ${back?'':'gt'}">${t}</h1>${right||''}</div>`;
const delb=(t,id)=>`<button data-a="del" data-t="${t}" data-id="${id}" class="text-mute text-xl px-1.5" aria-label="Delete">×</button>`;
const row=(inner,k,x='')=>`<div class="card p-3.5"><div class="flex items-center gap-3">${inner}</div>${x}${chips(k)}</div>`;
const ibtn=(h,i)=>`<a href="${h}" target="_blank" rel="noopener" class="ib">${i}</a>`;

function clist(){
  const q=R.q.toLowerCase();
  const L=S.c.filter(c=>(c.name+' '+c.f.map(f=>f.v).join(' ')).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  return L.length?L.map(c=>{const b=bal(c.id),p=c.f.find(f=>f.t==='ph');return `<div data-a="open" data-id="${c.id}" class="card p-3.5 flex items-center gap-3.5 active:scale-[.98] transition">${av(c.name)}<div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(c.name)}</div><div class="text-xs text-mute truncate">${esc(p?p.v:c.f.length?c.f[0].v:'No details yet')}</div></div><div class="text-right"><div class="${bc(b)} font-extrabold">${b?MV(b):'—'}</div><div class="text-[10px] text-mute">${b>0?'owes you':b<0?'you owe':'settled'}</div></div></div>`}).join(''):`<div class="card p-10 text-center text-mute">No contacts yet.<br>Tap <b>+</b> to add one.</div>`;
}
function contacts(){
  let rec=0,pay=0;S.c.forEach(c=>{const b=bal(c.id);b>0?rec+=b:pay-=b});
  return head('Contacts',0,`<button data-a="sett" class="btn !p-0 w-11 h-11 grid place-items-center" aria-label="Settings">⚙️</button><button data-a="addc" class="grad w-11 h-11 rounded-full text-2xl shadow-card active:scale-90 transition" aria-label="Add contact">+</button>`)+
  `<div class="px-5 grid grid-cols-2 gap-3"><div class="card p-4" style="${tint('pos')}"><div class="text-xs font-semibold text-mute">You will receive</div><div class="text-pos font-extrabold text-xl mt-1">${MV(rec)}</div></div><div class="card p-4" style="${tint('neg')}"><div class="text-xs font-semibold text-mute">You will pay</div><div class="text-neg font-extrabold text-xl mt-1">${MV(pay)}</div></div></div>
  <div class="px-5 pt-4"><input id="q" value="${esc(R.q)}" placeholder="🔍  Search name, number, link…" class="inp shadow-card"></div><div id="cl" class="px-5 pt-3 space-y-2.5">${clist()}</div>`;
}

function fieldRow(f){
  const d=digits(f.v),p=f.v.replace(/[^\d+]/g,'');let a='';
  if(f.t==='ph')a=ibtn('tel:'+p,'📞')+ibtn('sms:'+p,'💬')+ibtn('https://wa.me/'+d,'🟢')+ibtn('https://t.me/+'+d,'✈️');
  else if(f.t==='em')a=ibtn('mailto:'+f.v,'✉️');
  else if(f.t==='ln')a=ibtn(/^https?:/.test(f.v)?f.v:'https://'+f.v,'↗');
  else if(f.t==='ad')a=ibtn('https://maps.google.com/?q='+encodeURIComponent(f.v),'🗺️');
  else if(f.t==='sc'){const h=f.v.replace('@',''),L=(f.l||'').toLowerCase();a=ibtn(/^https?:/.test(f.v)?f.v:L.includes('insta')?'https://instagram.com/'+h:L.includes('tele')?'https://t.me/'+h:L.includes('twit')?'https://x.com/'+h:'https://'+f.v,'↗')}
  return `<div class="py-3 border-b border-line last:border-0"><div class="flex gap-3" data-a="editf" data-id="${f.id}"><div class="text-xl">${IC[f.t]}</div><div class="min-w-0 flex-1"><div class="text-[11px] font-semibold uppercase tracking-wider text-mute">${esc(f.l||TN[f.t])}</div><div class="font-semibold break-words">${esc(f.v)}</div></div></div><div class="flex gap-1.5 mt-2 pl-9">${a}<button data-a="copy" data-v="${esc(f.v)}" class="ib">⧉</button><button data-a="editf" data-id="${f.id}" class="ib">✎</button><button data-a="delf" data-id="${f.id}" class="ib text-neg">🗑</button></div>${chips('f:'+f.id)}</div>`;
}
function contactView(){
  const c=S.c.find(x=>x.id===R.cid);if(!c){R.cid=null;return contacts()}
  const b=bal(c.id),p=c.f.find(f=>f.t==='ph'),e=c.f.find(f=>f.t==='em');
  const q=(h,l)=>`<a href="${h}" target="_blank" rel="noopener" class="flex-1 rounded-2xl py-2.5 text-center text-sm font-bold" style="background:rgba(255,255,255,.2)">${l}</a>`;

  <div class="card px-4 py-2 mt-4"><div class="flex items-center justify-between pt-2"><div class="font-extrabold">Details</div><button data-a="addf" class="chip border-dashed">＋ Add phone, link, other…</button></div>${c.f.map(fieldRow).join('')||'<p class="text-mute text-sm py-4 text-center">No details yet.</p>'}<div class="pb-2">${chips('c:'+c.id)}</div></div></div><div class="mt-4">${body(c.id)}</div>`;

function general(){

function body(cid){
  const g=cid===null,tabs=[['ledger','Ledger'],['lists','Lists'],['notes','Notes'],['rem','Alarms'],['bank','Bank']];
  let h=`<div class="mx-5 p-1 rounded-full bg-line flex">${tabs.map(([k,n])=>`<button data-a="sub" data-id="${k}" class="flex-1 py-2 rounded-full text-[12px] font-bold transition ${R.sub===k?'bg-card text-pri shadow-card':'text-mute'}">${n}</button>`).join('')}</div><div class="px-5 pt-4 space-y-2.5">`;
  if(R.sub==='bank'){h+=bankTab(cid)}else if(R.sub==='ledger'){
    h+=`<div class="flex gap-2.5"><button data-a="credit" class="btn flex-1 text-pos">↗ ${g?'Income':'Credit'}</button><button data-a="debit" class="btn flex-1 text-neg">↘ ${g?'Expense':'Debit'}</button></div>`;
    S.l.filter(l=>l.cid===cid&&l.post&&l.k==='calc').forEach(l=>{h+=`<div data-a="openl" data-id="${l.id}" class="card p-3.5 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl grid place-items-center text-lg" style="${tint('pri')}">🧮</div><div class="flex-1"><div class="font-bold">${esc(l.title)}</div><div class="text-xs text-mute">Pending from list</div></div><div class="text-pos font-extrabold">+${fmt(tot(l).q)}</div></div>`});
    const T=S.t.filter(t=>t.cid===cid).sort((a,b)=>b.d.localeCompare(a.d));
    h+=T.map(t=>{const cr=t.type==='credit';return row(`<div class="w-11 h-11 rounded-2xl grid place-items-center text-lg font-bold ${cr?'text-pos':'text-neg'}" style="${tint(cr?'pos':'neg')}">${cr?'↗':'↘'}</div><div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(t.note||(cr?'Credit':'Debit'))}</div><div class="text-xs text-mute">${t.d}</div></div><div class="${cr?'text-pos':'text-neg'} font-extrabold">${cr?'+':'−'}${fmt(t.amt)}</div>${delb('t',t.id)}`,'t:'+t.id)}).join('');
    if(!T.length)h+=`<p class="text-center text-mute py-8">No entries yet.</p>`;
  }else if(R.sub==='lists'){
    h+=`<div class="flex gap-2.5"><button data-a="addl" data-k="calc" class="btn flex-1">🧮 Calculating</button><button data-a="addl" data-k="check" class="btn flex-1">☑️ Checklist</button></div>`;
    const L=S.l.filter(l=>l.cid===cid);
    h+=L.map(l=>{const t=tot(l),d=l.items.filter(i=>i.done).length,pc=l.k==='calc'?(t.t?t.p/t.t*100:0):(l.items.length?d/l.items.length*100:0);
      return `<div class="card p-3.5"><div class="flex items-center gap-3" data-a="openl" data-id="${l.id}"><div class="w-11 h-11 rounded-2xl grid place-items-center text-lg" style="${tint('pri')}">${l.k==='calc'?'🧮':'☑️'}</div><div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(l.title)}</div><div class="text-xs text-mute">${l.k==='calc'?`Total ${fmt(t.t)} · Pending ${fmt(t.q)}`:`${d} of ${l.items.length} done`}</div></div>${delb('l',l.id)}</div><div class="h-1.5 rounded-full bg-line mt-3 overflow-hidden"><div class="grad h-full rounded-full" style="width:${pc}%"></div></div>${chips('l:'+l.id)}</div>`}).join('');
    if(!L.length)h+=`<p class="text-center text-mute py-8">No lists yet.</p>`;
  }else if(R.sub==='notes'){
    h+=`<button data-a="addn" class="btn w-full">📝 New note</button>`;
    h+=S.n.filter(n=>n.cid===cid).map(n=>`<div class="card p-4"><div class="flex"><div class="flex-1 min-w-0"><div class="font-bold">${esc(n.title)}</div><div class="text-sm text-mute whitespace-pre-wrap mt-1">${esc(n.body)}</div></div>${delb('n',n.id)}</div>${chips('n:'+n.id)}</div>`).join('');
  }else{
    h+=`<button data-a="addr" class="btn w-full">⏰ New reminder</button>`;
    h+=S.r.filter(r=>r.cid===cid).sort((a,b)=>a.at.localeCompare(b.at)).map(r=>remRow(r,0)).join('');
  }
  return h+'</div>';
}
function remRow(r,chip){
  const c=S.c.find(x=>x.id===r.cid),late=!r.done&&r.at<nowStr();
  return row(`<input type="checkbox" data-a="rdone" data-id="${r.id}" ${r.done?'checked':''} class="w-6 h-6 accent-[var(--pri)]"><div class="flex-1 min-w-0 ${r.done?'opacity-50 line-through':''}"><div class="font-bold truncate">${esc(r.title)}</div><div class="text-xs ${late?'text-neg font-semibold':'text-mute'}">${r.at.replace('T',' · ')}${r.rep?' · 🔁':''}${chip&&c?' · '+esc(c.name):''}</div></div>${delb('r',r.id)}`,'r:'+r.id);
}
function reminders(){
  const n=nowStr(),day=n.slice(0,10),P=S.r.filter(r=>!r.done).sort((a,b)=>a.at.localeCompare(b.at));
  const grp=(t,L)=>L.length?`<div class="text-xs font-extrabold text-mute uppercase tracking-widest pt-3">${t}</div>`+L.map(r=>remRow(r,1)).join(''):'';
  return head('Alarms')+`<div class="px-5 space-y-2.5">${grp('Overdue',P.filter(r=>r.at<n))}${grp('Today',P.filter(r=>r.at>=n&&r.at.slice(0,10)===day))}${grp('Upcoming',P.filter(r=>r.at.slice(0,10)>day))}${grp('Done',S.r.filter(r=>r.done))}${S.r.length?'':'<div class="card p-10 text-center text-mute">No reminders yet.<br>Add them from a contact or General.</div>'}</div>`;
}

function listView(){
  const l=S.l.find(x=>x.id===R.lid);if(!l){R.lid=null;return contacts()}
  const c=S.c.find(x=>x.id===l.cid),calc=l.k==='calc',t=tot(l);
  let h=head(esc(l.title),1,`<button data-a="additem" class="grad rounded-full px-4 h-10 text-sm font-bold shadow-card">+ Item</button>`)+`<div class="px-5 space-y-2.5">`+`<div class="card p-3.5">${chips('l:'+l.id).replace('mt-3','')}</div>`;
  if(calc&&c)h+=`<label class="card p-3.5 flex items-center gap-3 text-sm font-semibold"><input type="checkbox" data-a="post" ${l.post?'checked':''} class="w-5 h-5 accent-[var(--pri)]"> Count pending in ${esc(c.name)}’s balance</label>`;
  h+=l.items.map(i=>{
    if(!calc)return row(`<input type="checkbox" data-a="done" data-id="${i.id}" ${i.done?'checked':''} class="w-6 h-6 accent-[var(--pri)]"><div class="flex-1 font-semibold ${i.done?'opacity-50 line-through':''}">${esc(i.name)}</div>${delb('i',i.id)}`,'i:'+i.id);
    const tl=lt(i),pv=pd(i),full=pv>=tl&&tl>0;
    return row(`<input type="checkbox" data-a="tick" data-id="${i.id}" ${full?'checked':''} class="w-6 h-6 accent-[var(--pri)]"><div class="flex-1 min-w-0"><div class="font-bold truncate ${full?'line-through opacity-60':''}">${esc(i.name)}</div><div class="text-xs text-mute">${i.qty} × ${fmt(i.price)}</div></div><div class="text-right"><div class="font-extrabold">${fmt(tl)}</div><div class="text-xs font-semibold ${pv?'text-pos':'text-mute'}">${full?'✓ Paid':pv?'Paid '+fmt(pv):'Unpaid'}</div></div>${delb('i',i.id)}`,'i:'+i.id,tl>0?hist(i,tl,pv):'')}).join('');
  if(!l.items.length)h+=`<p class="text-center text-mute py-8">No items yet. Tap + Item.</p>`;
  h+='</div>';
  if(calc)h+=`<div class="glass fixed inset-x-4 max-w-md mx-auto z-20 card p-3.5" style="bottom:calc(84px + env(safe-area-inset-bottom,0px))"><div class="grid grid-cols-3 text-center"><div><div class="text-[11px] font-semibold text-mute">TOTAL</div><div class="font-extrabold">${fmt(t.t)}</div></div><div><div class="text-[11px] font-semibold text-mute">PAID</div><div class="font-extrabold text-pos">${fmt(t.p)}</div></div><div><div class="text-[11px] font-semibold text-mute">PENDING</div><div class="font-extrabold text-neg">${fmt(t.q)}</div></div></div><div class="flex gap-2 mt-3"><button data-a="allpaid" class="btn flex-1 !px-2">All paid</button><button data-a="clrpaid" class="btn flex-1 !px-2">Clear</button>${c&&c.f.some(f=>f.t==='ph')?`<a href="https://wa.me/${digits(c.f.find(f=>f.t==='ph').v)}?text=${encodeURIComponent('Hi '+c.name+', pending for '+l.title+': '+fmt(t.q))}" target="_blank" rel="noopener" class="grad rounded-2xl px-3 py-2.5 text-sm font-bold flex-1 text-center">Remind</a>`:''}</div></div>`;
  return h;
}

function render(){
  $('#app').innerHTML=R.lid?listView():R.cid&&R.tab==='c'?contactView():R.tab==='c'?contacts():R.tab==='g'?general():reminders();
  const late=S.r.filter(r=>!r.done&&r.at<nowStr()).length;
  $('#nav').innerHTML=[['c','👥','Contacts'],['g','🗂️','General'],['r','⏰','Alarms']].map(([k,i,n])=>`<button data-a="nav" data-id="${k}" class="flex-1 py-2 rounded-[22px] text-[11px] font-bold relative transition ${R.tab===k?'grad shadow-card':'text-mute'}"><div class="text-lg leading-tight">${i}</div>${n}${k==='r'&&late?`<span class="absolute top-1 right-[22%] rounded-full text-[10px] px-1.5 text-white" style="background:var(--neg)">${late}</span>`:''}</button>`).join('');
}

const item=id=>S.l.find(x=>x.id===R.lid).items.find(i=>i.id===id);
const types=[['ph','📞 Phone'],['em','✉️ Email'],['ln','🔗 Link'],['ad','📍 Address'],['bd','🎂 Birthday (YYYY-MM-DD)'],['sc','@ Social handle'],['ot','📝 Other']];

  addc:()=>sheet('New contact',[['name','Name'],['v','First phone (optional)','tel']],v=>{if(!v.name)return false;const c={id:uid(),name:v.name,f:[]};if(v.v)c.f.push({id:uid(),t:'ph',l:'Mobile',v:v.v});S.c.push(c);R.cid=c.id}),

  addr:()=>{const t=new Date(Date.now()-new Date().getTimezoneOffset()*6e4+864e5);t.setUTCHours(9,0,0,0);sheet('New reminder',[['title','What to remember'],['at','','datetime-local',t.toISOString().slice(0,16)]],v=>{if(!v.title||!v.at)return false;S.r.push({id:uid(),cid:cur(),title:v.title,at:v.at,done:false})})},
  del:d=>ask('Delete this?','This cannot be undone. Its links will be removed too.','Delete',()=>kill(d.t,d.id)),
  rdone:d=>{const r=S.r.find(x=>x.id===d.id);r.done=!r.done},
  additem:()=>{const l=S.l.find(x=>x.id===R.lid);l.k==='calc'?sheet('Add item',[['name','Item name'],['qty','Quantity','number','1'],['price','Unit price','number']],v=>{if(!v.name)return false;l.items.push({id:uid(),name:v.name,qty:+v.qty||1,price:+v.price||0,paid:0})}):sheet('Add item',[['name','Item']],v=>{if(!v.name)return false;l.items.push({id:uid(),name:v.name,done:false})})},
  tick:d=>{const i=item(d.id);i.paid=(i.paid||0)>=lt(i)?0:lt(i)},

  clrpaid:()=>ask('Clear all payments?','Every row will go back to unpaid.','Clear',()=>S.l.find(x=>x.id===R.lid).items.forEach(i=>i.paid=0),'neg','↩️'),

/* ===== v3 additions ===== */
const today=()=>nowStr().slice(0,10);
const mig=()=>{S.b=S.b||[];S.a=S.a||[];S.x=S.x||[];S.m=S.m||[];if(!S.tp)S.tp=[{id:'tp1',title:'Payment reminder',body:'Hi {name}, a gentle reminder about {amount} due on {date}.'},{id:'tp2',title:'Thank you',body:'Hi {name}, thank you for your payment of {amount}.'}];S.set=S.set||{};if(!S.set.born)S.set.born=today();S.l.forEach(l=>l.items.forEach(i=>{if(!i.pays){i.pays=i.paid>0?[{id:uid(),amt:i.paid,d:today()}]:[];delete i.paid}}))};mig();
const applyTheme=()=>{const t=S.set.theme,r=document.documentElement;if(t&&t!=='auto')r.dataset.theme=t;else delete r.dataset.theme};applyTheme();
const hist=(i,tl,pv)=>`<div class="mt-3 rounded-2xl p-3" style="${tint('pri',8)}"><div class="flex items-center justify-between text-xs font-semibold"><span class="text-mute">💰 ${(i.pays||[]).length} payment${(i.pays||[]).length===1?'':'s'} · ${fmt(tl-pv)} left</span><button data-a="part" data-id="${i.id}" class="text-pri font-bold">＋ Add payment</button></div>${(i.pays||[]).map((p,n)=>`<div class="pt-2"><div class="flex items-center gap-2 text-sm"><span class="w-5 h-5 rounded-full grid place-items-center text-[10px] font-bold grad">${n+1}</span><span class="flex-1 text-mute">${p.d}</span><b class="text-pos">+${fmt(p.amt)}</b><button data-a="delpay" data-id="${i.id}" data-p="${p.id}" class="text-mute px-1" aria-label="Remove payment">×</button></div>${chipsM('p:'+p.id)}</div>`).join('')}<div class="h-1.5 rounded-full bg-line mt-3 overflow-hidden"><div class="grad h-full" style="width:${tl?pv/tl*100:0}%"></div></div></div>`;
const tick=d=>{const i=item(d.id),r=lt(i)-pd(i);if(r>0)(i.pays=i.pays||[]).push({id:uid(),amt:r,d:today()});else ask('Clear payments?','All payments for this item will be removed.','Clear',()=>{i.pays=[]},'neg','↩️')};
const part=d=>{const i=item(d.id),r=lt(i)-pd(i);if(r<=0)return toast('Already fully paid');sheet('Add payment · '+fmt(r)+' left',[['amt','Amount','number',r],['d','','date',today()]],v=>{const a=Math.min(+v.amt||0,r);if(a<=0)return false;(i.pays=i.pays||[]).push({id:uid(),amt:a,d:v.d||today()})})};
const delpay=d=>ask('Remove this payment?','The paid amount of this item will go down.','Remove',()=>{const i=item(d.id);i.pays=i.pays.filter(p=>p.id!==d.p)},'neg','↩️');
const allpaid=()=>ask('Mark everything paid?','Each unpaid balance is added as a payment dated today.','Mark all paid',()=>S.l.find(x=>x.id===R.lid).items.forEach(i=>{const r=lt(i)-pd(i);if(r>0)(i.pays=i.pays||[]).push({id:uid(),amt:r,d:today()})}),'pos','✅');
const clrpaid=()=>ask('Clear all payments?','Every payment on this list will be removed.','Clear',()=>S.l.find(x=>x.id===R.lid).items.forEach(i=>i.pays=[]),'neg','↩️');
const rdone=d=>{const r=S.r.find(x=>x.id===d.id);if(r.rep&&!r.done){const t=new Date(r.at);r.rep==='d'?t.setDate(t.getDate()+1):r.rep==='w'?t.setDate(t.getDate()+7):t.setMonth(t.getMonth()+1);r.at=new Date(t.getTime()-t.getTimezoneOffset()*6e4).toISOString().slice(0,16);r.n=0;toast('Next: '+r.at.replace('T',' '))}else r.done=!r.done};
const addr=()=>{const t=new Date(Date.now()-new Date().getTimezoneOffset()*6e4+864e5);t.setUTCHours(9,0,0,0);sheet('New reminder',[['title','What to remember'],['at','','datetime-local',t.toISOString().slice(0,16)],['rep','','sel','',[['','Does not repeat'],['d','Repeats daily'],['w','Repeats weekly'],['m','Repeats monthly']]]],v=>{if(!v.title||!v.at)return false;S.r.push({id:uid(),cid:cur(),title:v.title,at:v.at,rep:v.rep,done:false})})};
/* bank accounts */
const bsheet=(t,b,ok)=>sheet(t,[['label','Label (Savings, Business…)','text',b.label],['bank','Bank name','text',b.bank],['holder','Account holder','text',b.holder],['acc','Account number','text',b.acc],['ifsc','IFSC / SWIFT','text',b.ifsc],['upi','UPI ID','text',b.upi],['notes','Notes','text',b.notes]],v=>{if(!v.acc&&!v.upi&&!v.label)return false;ok(v)});
function bankTab(cid){
